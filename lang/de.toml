"Desktop Dock crashed several times in a few minutes, so it won't restart by itself.\n\nThe details are in the dock folder's logs\\dock.log. Start it again from the Start menu when you're ready." = "Desktop Dock ist innerhalb weniger Minuten mehrmals abgestürzt und startet daher nicht von selbst neu.\n\nDie Details stehen in logs\\dock.log im Dock-Ordner. Starten Sie es über das Startmenü wieder, wenn Sie so weit sind."
"Desktop Dock crashed twice while starting, so it's running in safe mode: icons come only from its cache, and repairs and Recycle Bin checks are off.\n\nTo leave safe mode, right-click it > Exit Desktop Dock, then start it again from the Start menu." = "Desktop Dock ist beim Start zweimal abgestürzt und läuft daher im abgesicherten Modus: Symbole kommen nur aus dem Cache, Reparaturen und Papierkorb-Prüfungen sind aus.\n\nZum Verlassen des abgesicherten Modus: Rechtsklick auf das Dock > Desktop Dock beenden, dann über das Startmenü wieder starten."
