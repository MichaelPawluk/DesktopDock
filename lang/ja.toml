"Your dock is at the top of your screen: rest the pointer at the top edge to bring it out. It's in the Start menu too, and it starts with Windows." = "ドックは画面の上にあります。上端にポインターを置くと出てきます。スタート メニューにもあり、Windows と同時に起動します。"
"Your dock is at the top of your screen: rest the pointer at the top edge to bring it out. It's in the Start menu too." = "ドックは画面の上にあります。上端にポインターを置くと出てきます。スタート メニューにもあります。"
"Your dock is busy saving in another window. Try again in a moment." = "別のウィンドウでドックを保存中です。少し待ってからもう一度お試しください。"
"Your dock is saved automatically before changes (the last 20, at most one a minute) and once a day (the last 7). Snapshots are kept until you delete them from the backups folder. Before restoring, your current dock is saved as a snapshot." = "ドックは変更の前 (最新 20 件、1 分に 1 回まで) と 1 日 1 回 (最新 7 件) 自動的に保存されます。スナップショットは、バックアップ フォルダーから削除するまで残ります。復元の前に、今のドックはスナップショットとして保存されます。"
"Your dock was saved by a newer Desktop Dock, so this one can't change it." = "ドックは新しい Desktop Dock で保存されているため、このバージョンでは変更できません。"
"Your dock was saved by a newer Desktop Dock, so this one doesn't change it." = "ドックは新しい Desktop Dock で保存されているため、このバージョンでは変更しません。"
"Your dock's file can't be opened right now: {error}\n\nAnother program may be using it. The dock keeps its current setup and switches to your changes as soon as the file can be read." = "ドックのファイルを今は開けません: {error}\n\nほかのプログラムが使っている可能性があります。ドックは今の設定のまま動作し、ファイルを読み込めしだい変更を反映します。"
"Your dock's file can't be read right now, so it can't be changed. Fix the file, or right-click the dock > Restore last working version." = "ドックのファイルを今は読み込めないため、変更できません。ファイルを修正するか、ドックを右クリックして「前回の正常なバージョンを復元」を選んでください。"
"Your dock's file can't be read right now: {error}" = "ドックのファイルを今は読み込めません: {error}"
"Your dock's file couldn't be read. {error}\n\nThe dock keeps its current setup until the file is fixed." = "ドックのファイルを読み込めませんでした。{error}\n\nファイルが修正されるまで、ドックは今の設定のまま動作します。"
"Your dock's items" = "ドックの項目"
"Your icons" = "自分のアイコン"
"Zoom size" = "拡大時のサイズ"
"Zoom time" = "拡大する時間"
"[dock] in dock.toml isn't a section" = "dock.toml の [dock] がセクションになっていません"
"dock.toml has an error (right-click the dock to restore it)" = "dock.toml にエラーがあります (復元するにはドックを右クリック)"
"dock.toml has an error:\n\n{error}\n\nRunning your last working setup meanwhile. Fix the file and save it (the dock picks it up), or right-click the dock > Restore last working version." = "dock.toml にエラーがあります:\n\n{error}\n\nその間は、最後に正常だった設定で動作します。ファイルを修正して保存する (ドックが自動で読み込みます) か、ドックを右クリックして「前回の正常なバージョンを復元」を選んでください。"
"dock.toml has an error:\n\n{error}\n\nThere's no earlier working version, so the dock is empty meanwhile. Fix the file and save it (the dock picks it up)." = "dock.toml にエラーがあります:\n\n{error}\n\n以前の正常なバージョンがないため、その間ドックは空です。ファイルを修正して保存してください (ドックが自動で読み込みます)。"
"dock.toml has no items" = "dock.toml に項目がありません"
"dock.toml is from a newer Desktop Dock: it's used as it is" = "dock.toml は新しい Desktop Dock のもので、そのまま使われます"
