"{file} is empty, so the dock keeps your items as they are. It reads the file again once it has items in it (Dock settings > Versions has your recent versions)." = "{file} が空のため、ドックの項目はそのままにします。ファイルに項目が入ると再び読み込みます (最近のバージョンは「ドックの設定」>「バージョン履歴」にあります)。"
