"{file} is empty, so the dock keeps your items as they are. It reads the file again once it has items in it (Dock settings > Versions has your recent versions)." = "{file} est vide : le dock garde donc vos éléments tels quels. Il relira le fichier dès qu'il contiendra des éléments (Paramètres du dock > Versions contient vos versions récentes)."
"{file} was saved by a newer version of Desktop Dock.\n\nIt's being used as it is, and won't be saved over." = "{file} a été enregistré par une version plus récente de Desktop Dock.\n\nIl est utilisé tel quel et ne sera pas écrasé."
"{group} is empty: right-click an icon > Move to group" = "{group} est vide : clic droit sur une icône > Déplacer vers un groupe"
"{name} (a Windows item)" = "{name} (un élément Windows)"
"{name} (an app)" = "{name} (une application)"
"{name} (not found)" = "{name} (introuvable)"
"{name} is a group already." = "{name} est déjà un groupe."
"{name} is from a newer Desktop Dock; nothing changed." = "{name} vient d'une version plus récente de Desktop Dock ; rien n'a changé."
"{name} isn't a Desktop Dock file: {error}" = "{name} n'est pas un fichier Desktop Dock : {error}"
"{name} isn't a group." = "{name} n'est pas un groupe."
"{name} isn't on the dock any more." = "{name} n'est plus sur le dock."
"{name} properties" = "Propriétés de {name}"
"{name} wasn't put back: {error}" = "{name} n'a pas été remis en place : {error}"
"{name} wasn't removed: {error}" = "{name} n'a pas été retiré : {error}"
"{name}: its start-in folder {folder} isn't there any more, so it starts in the program's own folder" = "{name} : son dossier de démarrage {folder} n'existe plus, il démarre donc dans le dossier du programme"
"{name}: showing on the dock. Click Use this icon to keep it, or Cancel to go back." = "{name} : visible sur le dock. Cliquez sur Utiliser pour la garder, ou sur Annuler pour revenir en arrière."
"{name}: {target} wasn't found" = "{name} : {target} est introuvable"
"{n} icon" = ["{n} icône", "{n} icônes"]
"{n} icon couldn't be brought over; that item uses the program's own icon" = ["{n} icône n'a pas pu être récupérée ; l'élément utilise l'icône de son programme", "{n} icônes n'ont pas pu être récupérées ; ces éléments utilisent l'icône de leur programme"]
"{n} icon in Pictures\\Icons" = ["{n} icône dans Images\\Icons", "{n} icônes dans Images\\Icons"]
"{n} item has a version number in its folder ({names}). If an update moves it, the dock finds the new folder by itself" = ["{n} élément a un numéro de version dans son dossier ({names}). Si une mise à jour le déplace, le dock trouve le nouveau dossier tout seul", "{n} éléments ont un numéro de version dans leur dossier ({names}). Si une mise à jour les déplace, le dock trouve le nouveau dossier tout seul"]
"{n} note" = ["{n} remarque", "{n} remarques"]
