"Desktop Dock crashed several times in a few minutes, so it won't restart by itself.\n\nThe details are in the dock folder's logs\\dock.log. Start it again from the Start menu when you're ready." = "Desktop Dock s'est arrêté brutalement plusieurs fois en quelques minutes : il ne redémarrera donc pas de lui-même.\n\nLes détails se trouvent dans logs\\dock.log, dans le dossier du dock. Relancez-le depuis le menu Démarrer quand vous le souhaitez."
"Desktop Dock crashed twice while starting, so it's running in safe mode: icons come only from its cache, and repairs and Recycle Bin checks are off.\n\nTo leave safe mode, right-click it > Exit Desktop Dock, then start it again from the Start menu." = "Desktop Dock s'est arrêté brutalement deux fois au démarrage : il fonctionne donc en mode sans échec. Les icônes viennent uniquement de son cache, et les réparations et les vérifications de la Corbeille sont désactivées.\n\nPour quitter le mode sans échec, faites un clic droit dessus > Quitter Desktop Dock, puis relancez-le depuis le menu Démarrer."
