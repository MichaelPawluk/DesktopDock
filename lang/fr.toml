"Desktop Dock is running as administrator, so everything it opens runs as administrator too, and Windows won't let you drag files onto it.\n\nStart it the normal way (not \"Run as administrator\") to avoid this." = "Desktop Dock s'exécute en tant qu'administrateur : tout ce qu'il ouvre s'exécute donc aussi en tant qu'administrateur, et Windows ne vous laisse pas y faire glisser de fichiers.\n\nLancez-le normalement (pas avec « Exécuter en tant qu'administrateur ») pour éviter cela."
