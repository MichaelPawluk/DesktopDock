"Desktop Dock is running as administrator, so everything it opens runs as administrator too, and Windows won't let you drag files onto it.\n\nStart it the normal way (not \"Run as administrator\") to avoid this." = "Desktop Dock se está ejecutando como administrador, así que todo lo que abre también se ejecuta como administrador, y Windows no te deja arrastrar archivos hasta él.\n\nInícialo de la forma normal (no con \"Ejecutar como administrador\") para evitarlo."
