"Desktop Dock crashed several times in a few minutes, so it won't restart by itself.\n\nThe details are in the dock folder's logs\\dock.log. Start it again from the Start menu when you're ready." = "Desktop Dock se cerró inesperadamente varias veces en pocos minutos, así que no se volverá a iniciar solo.\n\nLos detalles están en logs\\dock.log, en la carpeta del dock. Vuelve a iniciarlo desde el menú Inicio cuando quieras."
"Desktop Dock crashed twice while starting, so it's running in safe mode: icons come only from its cache, and repairs and Recycle Bin checks are off.\n\nTo leave safe mode, right-click it > Exit Desktop Dock, then start it again from the Start menu." = "Desktop Dock se cerró inesperadamente dos veces al iniciarse, así que se está ejecutando en modo seguro: los iconos salen solo de su caché, y las reparaciones y las comprobaciones de la Papelera de reciclaje están desactivadas.\n\nPara salir del modo seguro, haz clic derecho en él > Salir de Desktop Dock y vuelve a iniciarlo desde el menú Inicio."
