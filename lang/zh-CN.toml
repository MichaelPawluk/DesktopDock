"{name} (an app)" = "{name}（应用）"
"{name} (not found)" = "{name}（未找到）"
"{name} is a group already." = "“{name}”已经是组了。"
"{name} is from a newer Desktop Dock; nothing changed." = "{name} 来自较新版本的 Desktop Dock；未做任何更改。"
"{name} isn't a Desktop Dock file: {error}" = "{name} 不是 Desktop Dock 文件：{error}"
"{name} isn't a group." = "“{name}”不是组。"
"{name} isn't on the dock any more." = "“{name}”已不在程序坞上。"
"{name} properties" = "{name} 属性"
"{name} wasn't put back: {error}" = "未能放回“{name}”：{error}"
"{name} wasn't removed: {error}" = "未能移除“{name}”：{error}"
"{name}: its start-in folder {folder} isn't there any more, so it starts in the program's own folder" = "{name}：它的起始位置文件夹 {folder} 已不存在，因此将在程序自己的文件夹中启动"
"{name}: showing on the dock. Click Use this icon to keep it, or Cancel to go back." = "{name}：正在程序坞上显示。单击“使用此图标”保留它，或单击“取消”返回。"
"{name}: {target} wasn't found" = "{name}：未找到 {target}"
