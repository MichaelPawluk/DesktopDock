"dock.toml has an error:\n\n{error}\n\nThere's no earlier working version, so the dock is empty meanwhile. Fix the file and save it (the dock picks it up)." = "dock.toml 有错误：\n\n{error}\n\n没有更早的可用版本，因此程序坞暂时为空。请修复并保存该文件（程序坞会自动读取）。"
"dock.toml has no items" = "dock.toml 中没有项目"
"dock.toml is from a newer Desktop Dock: it's used as it is" = "dock.toml 来自较新版本的 Desktop Dock：将按原样使用"
"group" = "组"
"item" = "项目"
"separator" = "分隔符"
"that group is empty" = "该组为空"
"{error} (Tried {when}.)" = "{error}（尝试时间：{when}）"
"{error}." = "{error}。"
"{file} has an error:\n\n{error}\n\nThe dock keeps its current setup until the file is fixed." = "{file} 有错误：\n\n{error}\n\n在该文件修复之前，程序坞会保持当前设置。"
"{file} has an error:\n\n{why}" = "{file} 有错误：\n\n{why}"
"{file} is empty, so the dock keeps your items as they are. It reads the file again once it has items in it (Dock settings > Versions has your recent versions)." = "{file} 为空，因此程序坞会保持你的项目不变。文件中有项目后，程序坞会重新读取它（程序坞设置 > 版本 中有你最近的版本）。"
"{file} was saved by a newer version of Desktop Dock.\n\nIt's being used as it is, and won't be saved over." = "{file} 由较新版本的 Desktop Dock 保存。\n\n将按原样使用它，且不会覆盖保存。"
"{group} is empty: right-click an icon > Move to group" = "“{group}”是空的：右键单击图标 > 移到组"
