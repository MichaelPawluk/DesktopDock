"Desktop Dock crashed several times in a few minutes, so it won't restart by itself.\n\nThe details are in the dock folder's logs\\dock.log. Start it again from the Start menu when you're ready." = "O Desktop Dock parou de funcionar várias vezes em poucos minutos, então não vai reiniciar sozinho.\n\nOs detalhes estão em logs\\dock.log, na pasta do dock. Abra-o de novo pelo menu Iniciar quando quiser."
