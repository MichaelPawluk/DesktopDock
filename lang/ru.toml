"Desktop Dock is installed" = "Desktop Dock установлен"
"Desktop Dock is running as administrator, so everything it opens runs as administrator too, and Windows won't let you drag files onto it.\n\nStart it the normal way (not \"Run as administrator\") to avoid this." = "Desktop Dock запущен от имени администратора, поэтому все, что он открывает, тоже запускается от имени администратора, а Windows не позволяет перетаскивать на него файлы.\n\nЧтобы этого избежать, запускайте его обычным способом (не через «Запуск от имени администратора»)."
