"Desktop Dock crashed several times in a few minutes, so it won't restart by itself.\n\nThe details are in the dock folder's logs\\dock.log. Start it again from the Start menu when you're ready." = "Desktop Dock несколько раз аварийно завершил работу за пару минут, поэтому сам он больше не перезапустится.\n\nПодробности — в файле logs\\dock.log в папке дока. Когда будете готовы, снова запустите его из меню «Пуск»."
"Desktop Dock crashed twice while starting, so it's running in safe mode: icons come only from its cache, and repairs and Recycle Bin checks are off.\n\nTo leave safe mode, right-click it > Exit Desktop Dock, then start it again from the Start menu." = "Desktop Dock дважды аварийно завершил работу при запуске, поэтому работает в безопасном режиме: значки берутся только из кэша, а исправления и проверки корзины отключены.\n\nЧтобы выйти из безопасного режима, щелкните док правой кнопкой мыши > «Выйти из Desktop Dock», а затем снова запустите его из меню «Пуск»."
